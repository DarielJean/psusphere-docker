{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="content">
    <div class="container-fluid">

        <h4 class="page-title">Student</h4>

        <div class="row">
            <div class="col-md-12">

                <div class="card">

                    <div class="card-header">
                        <div class="card-title">
                            {% if object %}
                                Edit Student
                            {% else %}
                                Add Student
                            {% endif %}
                        </div>

                        <div class="card-category">
                            Student Information
                        </div>
                    </div>

                    <div class="card-body">

                        <form method="POST">

                            {% csrf_token %}

                            {{ form.as_p }}

                            <button type="submit"
                                    class="btn btn-success btn-rounded">
                                Save
                            </button>

                            <a href="{% url 'student-list' %}"
                               class="btn btn-secondary btn-rounded">
                                Cancel
                            </a>

                        </form>

                    </div>

                </div>

            </div>
        </div>

    </div>
</div>
{% endblock %}
