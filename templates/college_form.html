{% extends 'base.html' %}

{% block title %}College Form{% endblock %}

{% block content %}

<div class="content">
    <div class="container-fluid">

        <div class="row">
            <div class="col-md-8">

                <div class="card">

                    <div class="card-header">
                        <h4 class="card-title">
                            {% if object %}
                                Edit College
                            {% else %}
                                Add College
                            {% endif %}
                        </h4>
                    </div>

                    <div class="card-body">

                        <form method="POST">
                            {% csrf_token %}

                            {{ form.as_p }}

                            <button type="submit" class="btn btn-primary">
                                Save
                            </button>

                            <a href="{% url 'college-list' %}"
                               class="btn btn-secondary">
                                Cancel
                            </a>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
