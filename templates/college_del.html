{% extends 'base.html' %}

{% block title %}Delete College{% endblock %}

{% block content %}

<div class="content">
    <div class="container-fluid">

        <div class="row">
            <div class="col-md-8">

                <div class="card">

                    <div class="card-header">
                        <h4 class="card-title">Delete College</h4>
                    </div>

                    <div class="card-body">

                        <p>
                            Are you sure you want to delete
                            <strong>{{ object.college_name }}</strong>?
                        </p>

                        <form method="POST">
                            {% csrf_token %}

                            <button type="submit" class="btn btn-danger">
                                Yes, Delete
                            </button>

                            <a href="{% url 'college-list' %}"
                               class="btn btn-secondary">
                                Cancel
                            </a>
                        </form>

                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
